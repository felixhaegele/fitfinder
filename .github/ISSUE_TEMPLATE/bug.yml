name: Bug report
description: Something doesn't work as expected
title: "fix: "
labels: ["type:bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the error message or a screenshot if there is one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Upload …
        3. See error
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - web
        - worker / measurement
        - database
        - infrastructure / CI
        - not sure
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser / OS / environment (local, preview, staging, production), commit or version.
  - type: markdown
    attributes:
      value: "⚠️ Don't attach photos that contain personal data, such as faces or EXIF location."
