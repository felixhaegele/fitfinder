# SonarQube Cloud: https://sonarcloud.io/project/overview?id=felixhaegele_fitfinder
sonar.projectKey=felixhaegele_fitfinder
sonar.organization=felixhaegele
sonar.projectName=FitFinder

# Production code vs tests: Sonar applies different rules to each.
sonar.sources=web/src,worker/app
sonar.tests=web/tests,web/e2e,worker/tests
sonar.sourceEncoding=UTF-8
# Generated code (supabase gen types) isn't ours to lint or cover.
# Binary assets aren't code (Sonar would try to read them as text).
sonar.exclusions=web/src/lib/database.types.ts,**/*.ico,**/*.png,**/*.jpg,**/*.pdf

# Coverage reports produced by the web and worker CI jobs
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info
sonar.python.coverage.reportPaths=worker/coverage.xml
sonar.python.version=3.12
