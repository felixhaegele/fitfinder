# SonarQube Cloud: https://sonarcloud.io/project/overview?id=felixhaegele_fitfinder
sonar.projectKey=felixhaegele_fitfinder
sonar.organization=felixhaegele
sonar.projectName=FitFinder

# Production code vs tests: Sonar applies different rules to each.
sonar.sources=web/src,worker/app
sonar.tests=web/tests,web/e2e,worker/tests
sonar.sourceEncoding=UTF-8
# Generated code (supabase gen types) isn't ours to lint or cover.
# Binary assets aren't code (Sonar would try to read them as text).
sonar.exclusions=web/src/lib/database.types.ts,**/*.ico,**/*.png,**/*.jpg,**/*.pdf

# Left out of the coverage *percentage* only (still analysed for bugs, smells and
# security): web glue code that the Playwright e2e tests cover, which Sonar can't see yet
# (#62). Logic in web/src/lib/ must still reach the Quality Gate's 80 % with unit tests.
#   app/**, components/**  Next.js pages, route handlers, server actions, UI
#   proxy.ts, lib/supabase  Supabase client and session wiring
#   instrumentation*.ts     Sentry init wiring (logic is in lib/sentry.ts, unit-tested)
#   lib/auth.ts             getUser()/requireUser(): Supabase calls
#   lib/submissions.ts      data access: Supabase queries and signed URLs
#   lib/prepare-photo.ts    canvas/ImageBitmap, browser-only (e2e checks EXIF + rotation)
sonar.coverage.exclusions=web/src/app/**,web/src/components/**,web/src/proxy.ts,web/src/instrumentation.ts,web/src/instrumentation-client.ts,web/src/lib/supabase/**,web/src/lib/auth.ts,web/src/lib/submissions.ts,web/src/lib/prepare-photo.ts

# Coverage reports produced by the web and worker CI jobs
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info
sonar.python.coverage.reportPaths=worker/coverage.xml
sonar.python.version=3.12
