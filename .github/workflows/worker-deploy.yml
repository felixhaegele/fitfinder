name: Worker deploy

# Builds the worker image, pushes it to Artifact Registry and points the Cloud Run Jobs
# at it: staging first, production after the owner approves (ADR 0012).
#
# Logs in to Google with Workload Identity Federation: GitHub's short-lived OIDC token
# is exchanged for the deployer service account. There is no stored Google key. Google
# only accepts tokens from this repo's main branch (infra/github_oidc.tf).
#
# Repo variables (not secrets; set from `terraform output`, see infra/README.md):
#   GCP_PROJECT_ID, GCP_REGION, GCP_WORKLOAD_IDENTITY_PROVIDER,
#   GCP_DEPLOY_SERVICE_ACCOUNT, WORKER_IMAGE

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'print/geometry/**' # baked into the image
      - '.github/workflows/worker-deploy.yml'
  workflow_dispatch:

# One deploy at a time; a newer push waits instead of cancelling a half-done rollout.
concurrency:
  group: worker-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # lets the job request GitHub's OIDC token for Google

jobs:
  build:
    runs-on: ubuntu-latest
    # Skips (instead of failing) until the owner has set up Google Cloud.
    if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
      - id: image
        run: echo "ref=${{ vars.WORKER_IMAGE }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token
        id: auth
      - uses: docker/login-action@v4
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: worker
          # Template geometry lives outside worker/; see the comment in worker/Dockerfile.
          build-contexts: geometry=print/geometry
          push: true
          tags: ${{ steps.image.outputs.ref }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max

  staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Point the staging job at the new image
        run: |
          gcloud run jobs update fitfinder-drain-staging \
            --image "${{ needs.build.outputs.image }}" \
            --region "${{ vars.GCP_REGION }}" --quiet

  production:
    needs: [build, staging]
    runs-on: ubuntu-latest
    environment: production # requires the owner's approval
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Point the production job at the new image
        run: |
          gcloud run jobs update fitfinder-drain-prod \
            --image "${{ needs.build.outputs.image }}" \
            --region "${{ vars.GCP_REGION }}" --quiet
