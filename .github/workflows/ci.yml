name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR cancels the older, now-pointless run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: jobs can read the repo and nothing else unless they ask.
permissions:
  contents: read

jobs:
  # Decides which packages changed, so a docs-only PR doesn't run the worker tests.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      # On pushes to main, always test web and worker: SonarQube Cloud compares PRs against
      # main, so main's analysis needs coverage for the whole repo, not just what changed.
      web: ${{ github.event_name == 'push' && 'true' || steps.filter.outputs.web }}
      worker: ${{ github.event_name == 'push' && 'true' || steps.filter.outputs.worker }}
      supabase: ${{ steps.filter.outputs.supabase }}
      print: ${{ steps.filter.outputs.print }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'
            worker:
              - 'worker/**'
              - 'print/geometry/**' # the worker reads the template geometry
              - '.github/workflows/ci.yml'
            supabase:
              - 'supabase/**'
              - 'web/src/lib/database.types.ts'
              - '.github/workflows/ci.yml'
            print:
              - 'print/**'
              - 'web/public/fitfinder-template-*.pdf' # the copy users download
              - '.github/workflows/ci.yml'
            infra:
              - 'infra/**'
              - '.github/workflows/ci.yml'

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      # Proves the production build works without any Supabase env (e.g. no secrets in forks).
      - run: pnpm build
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-web
          path: web/coverage/lcov.info
          retention-days: 7

  # Browser tests against a real local Supabase (Auth + Mailpit), e.g. the full magic-link
  # login. Separate from `web` so lint/unit feedback stays fast; runs when the web app or
  # the database changes, since either can break a user flow.
  e2e:
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.supabase == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: supabase/setup-cli@v3
        with:
          version: 2.121.0 # keep in step with the CLI used locally
      - run: pnpm install --frozen-lockfile
      # Only what the browser tests need: Postgres, Auth (gotrue), API gateway (kong),
      # REST, Storage, Mailpit. Skipping the rest saves a minute or more.
      - name: Start Supabase
        working-directory: .
        run: supabase start -x studio,imgproxy,realtime,postgres-meta,edge-runtime,logflare,vector,supavisor
      - name: Write web/.env.local from the local stack
        working-directory: .
        run: |
          supabase status -o json > /tmp/supabase.json
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(jq -r .API_URL /tmp/supabase.json)"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(jq -r .PUBLISHABLE_KEY /tmp/supabase.json)"
            # Local dev key, not a real secret. Tests use it to inspect stored uploads.
            echo "SUPABASE_SECRET_KEY=$(jq -r .SECRET_KEY /tmp/supabase.json)"
          } > web/.env.local
      - run: pnpm exec playwright install --with-deps chromium
      # Same tests as `pnpm test:e2e`, plus V8 coverage from browser and server (#62).
      - run: pnpm test:e2e:coverage
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-web-e2e
          path: web/coverage-e2e/report/lcov-e2e.info
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  worker:
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0 # no floating major tag published; Dependabot bumps this
        with:
          enable-cache: true
          cache-dependency-glob: worker/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-worker
          path: worker/coverage.xml
          retention-days: 7

  # Lints and tests the template generator, then publishes the PDF as a downloadable
  # artifact so reviewers can print it without installing anything.
  print:
    needs: changes
    if: needs.changes.outputs.print == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: print
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0 # no floating major tag published; Dependabot bumps this
        with:
          enable-cache: true
          cache-dependency-glob: print/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - run: uv run python -m fitfinder_template
      # The website serves a committed copy. It must be exactly what the generator makes
      # from the geometry, or users would print a sheet the worker doesn't measure with.
      - name: Check the website's template PDF is up to date
        run: |
          if ! cmp out/fitfinder-template-a4-v1.pdf ../web/public/fitfinder-template-a4-v1.pdf; then
            echo "::error file=web/public/fitfinder-template-a4-v1.pdf::Out of date. Run: cd print && uv run python -m fitfinder_template -o ../web/public/fitfinder-template-a4-v1.pdf"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: template-pdf
          path: print/out/*.pdf
          retention-days: 30

  # Proves the Dockerfile still builds. Pushing to a registry comes with deployment (Milestone 6).
  worker-image:
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: worker
          # Template geometry lives outside worker/; see the comment in worker/Dockerfile.
          build-contexts: geometry=print/geometry
          push: false
          load: true
          tags: fitfinder-worker:ci
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max
      - name: Smoke test /health
        run: |
          docker run -d --name worker -p 8080:8080 fitfinder-worker:ci
          for i in $(seq 1 20); do
            curl -fsS localhost:8080/health && exit 0
            sleep 1
          done
          docker logs worker
          exit 1
      # Proves the geometry JSON made it into the image and OpenCV's native libs load.
      - name: Smoke test template geometry
        run: |
          docker run --rm fitfinder-worker:ci python -c \
            "from app.pipeline.template import load_template; import cv2; print(load_template().id, cv2.__version__)"

  # Applies every migration to a fresh Postgres, lints the schema and runs the pgTAP tests,
  # then the worker's integration tests (enqueue -> drain -> rows and files) against the
  # same stack. Those need Storage, Auth and the API gateway too, so it starts more than the
  # database. Also runs when only the worker changed (and on every push to main): a worker
  # change can break its inserts just as a migration can.
  supabase:
    needs: changes
    if: needs.changes.outputs.supabase == 'true' || needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.121.0 # keep in step with the CLI used locally
      - run: supabase start -x studio,imgproxy,realtime,postgres-meta,edge-runtime,logflare,vector,supavisor
      - run: supabase db lint --fail-on error
      - run: supabase test db
      # The web app's TypeScript types are generated from the schema. If a migration
      # changed the schema but nobody regenerated them, fail here instead of at runtime.
      - name: Check generated TS types are up to date
        run: |
          supabase gen types typescript --local > /tmp/database.types.ts
          if ! diff -u web/src/lib/database.types.ts /tmp/database.types.ts; then
            echo "::error file=web/src/lib/database.types.ts::Out of date. Run: supabase gen types typescript --local > web/src/lib/database.types.ts"
            exit 1
          fi
      - name: Export the local stack's URL and keys for the worker
        run: |
          supabase status -o json > /tmp/supabase.json
          {
            echo "SUPABASE_URL=$(jq -r .API_URL /tmp/supabase.json)"
            # Local dev key, not a real secret.
            echo "SUPABASE_SECRET_KEY=$(jq -r .SECRET_KEY /tmp/supabase.json)"
            echo "SUPABASE_DB_URL=$(jq -r .DB_URL /tmp/supabase.json)"
          } >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v10.3.0 # no floating major tag published; Dependabot bumps this
        with:
          enable-cache: true
          cache-dependency-glob: worker/uv.lock
      - run: uv sync --locked
        working-directory: worker
      # REQUIRE_SUPABASE=1 turns "stack not reachable" into an error instead of a skip,
      # so this step can't pass without running the tests. -rs lists any skips anyway.
      - name: Worker integration tests
        working-directory: worker
        env:
          REQUIRE_SUPABASE: "1"
        run: uv run pytest tests/test_integration.py -rs --cov-report=xml:coverage-integration.xml
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-worker-integration
          path: worker/coverage-integration.xml
          retention-days: 7

  # Terraform for Google Cloud (worker hosting, ADR 0012): formatting and a validity
  # check without credentials. Applying stays a deliberate step by the owner.
  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.6 # keep in step with the version used locally
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  # Static analysis + coverage across both packages. Skips itself when the token
  # isn't available (e.g. Dependabot PRs, which don't get repo secrets).
  sonar:
    needs: [changes, web, e2e, worker, supabase]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0 # full history lets Sonar tell new code from old
      - uses: actions/download-artifact@v8
        if: env.SONAR_TOKEN != ''
        with:
          pattern: coverage-*
          path: coverage
      - name: Put coverage reports where sonar-project.properties expects them
        if: env.SONAR_TOKEN != ''
        # Reports contain paths relative to each package (src/..., app/...);
        # Sonar resolves them from the repo root, so prefix the package directory.
        # Found by name: with a single artifact, download-artifact extracts it straight into
        # coverage/; with several, into coverage/<artifact-name>/.
        run: |
          mkdir -p web/coverage
          lcov=$(find coverage -name lcov.info | head -n 1)
          e2e=$(find coverage -name lcov-e2e.info | head -n 1)
          # Unit (Vitest) and e2e (Playwright) reports become one file: LCOV may list a
          # source file several times, and Sonar adds up the hits of all its records.
          if [ -n "$lcov$e2e" ]; then
            cat $lcov $e2e | sed 's#^SF:#SF:web/#' > web/coverage/lcov.info
          fi
          cobertura=$(find coverage -name coverage.xml | head -n 1)
          if [ -n "$cobertura" ]; then
            sed 's#<source>app</source>#<source>worker/app</source>#' "$cobertura" > worker/coverage.xml
          fi
          # Worker integration tests (supabase job); Sonar merges both worker reports.
          integration=$(find coverage -name coverage-integration.xml | head -n 1)
          if [ -n "$integration" ]; then
            sed 's#<source>app</source>#<source>worker/app</source>#' "$integration" > worker/coverage-integration.xml
          fi
          echo "web coverage: ${lcov:-none} + ${e2e:-none}, worker coverage: ${cobertura:-none}, worker integration coverage: ${integration:-none}"
      - uses: SonarSource/sonarqube-scan-action@v8
        if: env.SONAR_TOKEN != ''
      - if: env.SONAR_TOKEN == ''
        run: echo "::notice::SONAR_TOKEN not available, skipping SonarQube Cloud analysis."

  # The one check branch protection requires. Path filters mean web/worker jobs are
  # sometimes skipped, and a required check that's skipped never reports — so this
  # job always runs and fails only if something that did run failed.
  ci-ok:
    needs: [changes, web, e2e, worker, worker-image, supabase, print, infra]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then exit 1; fi
          done
