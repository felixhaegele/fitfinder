[project]
name = "fitfinder-worker"
version = "0.1.0"
description = "Measures shoe insoles from photos and classifies them by foot shape."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]>=0.143.2",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "sentry-sdk[fastapi]>=2.72.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.uv]
# This is an application, not a library to publish on PyPI.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, UP pyupgrade,
# N naming, S bandit (security), SIM simplify, RUF ruff-specific
select = ["E", "W", "F", "I", "B", "UP", "N", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest works
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
branch = true
# Paths in coverage.xml relative to the repo root, so SonarQube Cloud can map them
relative_files = true
