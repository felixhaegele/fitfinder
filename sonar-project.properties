# SonarQube Cloud: https://sonarcloud.io/project/overview?id=felixhaegele_fitfinder
sonar.projectKey=felixhaegele_fitfinder
sonar.organization=felixhaegele
sonar.projectName=FitFinder

# Production code vs tests: Sonar applies different rules to each.
sonar.sources=web/src,worker/app
sonar.tests=web/tests,web/e2e,worker/tests
sonar.sourceEncoding=UTF-8
# Generated code (supabase gen types) isn't ours to lint or cover.
# Binary assets aren't code (Sonar would try to read them as text).
sonar.exclusions=web/src/lib/database.types.ts,**/*.ico,**/*.png,**/*.jpg,**/*.pdf

# Left out of the coverage *percentage* only (still analysed for bugs, smells and
# security). Unit (Vitest) and e2e (Playwright, #62) coverage both count; these files
# stay below 80 % even with both, mostly error paths the e2e tests don't trigger.
# Remove a file once a test covers it.
#   app/auth/actions.ts, app/upload/actions.ts,
#   app/account/delete/actions.ts   server actions: Supabase error branches
#   app/upload/upload-form.tsx      client-side error states of the upload form
#   app/global-error.tsx            only renders when the root layout crashes
#   app/layout.tsx                  next/font calls are compiled away, so never "run"
#   lib/supabase/admin.ts, env.ts   missing-env-var errors
#   lib/supabase/proxy.ts           session refresh (only after the token expires)
sonar.coverage.exclusions=web/src/app/auth/actions.ts,web/src/app/upload/actions.ts,web/src/app/account/delete/actions.ts,web/src/app/upload/upload-form.tsx,web/src/app/global-error.tsx,web/src/app/layout.tsx,web/src/lib/supabase/admin.ts,web/src/lib/supabase/env.ts,web/src/lib/supabase/proxy.ts

# Coverage reports produced by the web and worker CI jobs
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info
sonar.python.coverage.reportPaths=worker/coverage.xml,worker/coverage-integration.xml
sonar.python.version=3.12
