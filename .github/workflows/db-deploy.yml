name: Database deploy

# Applies supabase/migrations/ to the hosted Supabase projects:
#   PR          → dry run against staging: shows which migrations would be applied
#   merge/main  → staging, then production after the owner approves in GitHub
#
# Secrets live in the GitHub Environments "staging" and "production" (see
# docs/environments.md): SUPABASE_ACCESS_TOKEN and the variable SUPABASE_PROJECT_REF.
# "production" only accepts the main branch and needs approval.
#
# No database password: without SUPABASE_DB_PASSWORD the CLI creates a temporary login
# role through the access token ("Initialising login role..."). One secret less, and
# resetting a database password can't break deploys.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/db-deploy.yml'
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/db-deploy.yml'
  workflow_dispatch:

# Never run two deploys against the same database at once, and never cancel one halfway.
concurrency:
  group: db-deploy-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Read-only: links staging and lists pending migrations without applying them.
  dry-run:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.121.0 # keep in step with the CLI used locally
      # Forks and Dependabot PRs get no secrets: skip instead of failing.
      - if: env.SUPABASE_ACCESS_TOKEN == ''
        run: echo "::notice::Supabase secrets not available, skipping the dry run."
      - if: env.SUPABASE_ACCESS_TOKEN != ''
        run: supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
      - name: Migrations that would be applied to staging
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: supabase db push --dry-run

  staging:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.121.0
      - run: supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
      # No --include-seed: the seed was applied once by hand and isn't idempotent.
      - run: supabase db push --yes

  # Only after staging succeeded, and only once the owner approves ("Review deployments").
  production:
    needs: staging
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.121.0
      - run: supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
      - run: supabase db push --yes
